    <script>
      (function() {
        var suppress = function(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str === 'script error.' ||
            str.indexOf('script error') !== -1 ||
            str.indexOf('smartsupp') !== -1 ||
            str.indexOf('translate') !== -1 ||
            str.indexOf('google') !== -1
          );
        };
        window.onerror = function(message, source, lineno, colno, error) {
          if (suppress(message) || suppress(source) || (error && suppress(error.message))) {
            return true;
          }
          return false;
        };
        window.addEventListener('error', function(event) {
          if (suppress(event.message) || suppress(event.filename)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (reason && (suppress(reason) || (reason.message && suppress(reason.message)))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
      })();
    </script>
